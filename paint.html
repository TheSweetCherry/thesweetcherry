<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paint - thesweetcherry</title><link rel="stylesheet" href="styles.css"></head>
<body class="paint-bg subpage">
<nav class="topnav"><a href="index.html">home</a><a href="quiz.html">quiz</a><a href="paint.html">paint</a><a href="photobooth.html">photobooth</a><button class="sound-toggle" onclick="toggleSweetSound()">🔊 sound on</button></nav>
<h1 class="sub-title" style="font-weight:900">paint something cute</h1>
<div class="paint-layout"><aside class="thumbrail">
<div class="thumb active" data-t="heart">♡</div><div class="thumb" data-t="cat">🐱</div><div class="thumb" data-t="flower">✿</div><div class="thumb" data-t="star">☆</div><div class="thumb" data-t="bear">🧸</div><div class="thumb" data-t="blank">＋</div>
</aside><section>
<div class="paintwin"><div class="ptitle"><span>🎨 untitled - Paint</span><span>▢ ✕</span></div><div class="pmenu">File Edit View Image Colors Help</div>
<div class="pmain"><div class="tools"><button class="tool" id="brush">✏️</button><button class="tool" id="eraser">🧽</button><button class="tool" id="thin">•</button><button class="tool" id="thick">●</button><button class="tool" id="undo">↶</button><button class="tool" id="fill">🪣</button></div><div class="canvaswrap"><canvas id="c" width="760" height="520"></canvas></div></div>
<div class="palette" id="pal"></div><div class="pcontrols"><button class="btn" id="clear">clear</button><button class="btn" id="download">download PNG ↓</button></div></div>
<div class="gamebox"><div style="display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap"><div><div class="small">DRAWING CHALLENGE</div><div class="prompt" id="prompt">press start for a prompt.</div><div class="small" id="lvl">Level 1</div></div><div class="timer" id="timer">30</div></div><p class="small">Finish before time runs out. Each win gives you +10 seconds up to 60 seconds, while prompts get harder.</p><button class="btn primary" id="startGame">start game</button><button class="btn hidden" id="finishGame">I finished! ✓</button></div>
</section></div>
<script src="common.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d');let down=false,col='#d84f9b',size=5,erase=false,hist=[],templ='heart';
['#111','#fff','#f7b7cf','#ff6cae','#ffd260','#f09a75','#8bcf8b','#8eb7ff','#9b7be8','#a66d4f','#d24646','#7c3458'].forEach(v=>{const s=document.createElement('div');s.className='sw';s.style.background=v;s.onclick=()=>{col=v;erase=false};pal.appendChild(s)});
function save(){if(hist.length>22)hist.shift();hist.push(c.toDataURL())}
function restore(u){const im=new Image();im.onload=()=>{x.clearRect(0,0,c.width,c.height);x.drawImage(im,0,0)};im.src=u}
function template(t){templ=t;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#999';x.lineWidth=4;x.setLineDash([]);if(t==='heart'){x.beginPath();x.moveTo(380,420);x.bezierCurveTo(90,220,175,80,380,220);x.bezierCurveTo(585,80,670,220,380,420);x.stroke()}if(t==='cat'){x.beginPath();x.arc(380,280,145,0,Math.PI*2);x.stroke();x.beginPath();x.moveTo(275,175);x.lineTo(300,95);x.lineTo(350,160);x.moveTo(410,160);x.lineTo(465,95);x.lineTo(490,180);x.stroke()}if(t==='flower'){x.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,px=380+Math.cos(a)*100,py=250+Math.sin(a)*100;x.moveTo(380,250);x.arc(px,py,55,0,Math.PI*2)}x.stroke();x.beginPath();x.arc(380,250,55,0,Math.PI*2);x.moveTo(380,305);x.lineTo(380,455);x.stroke()}if(t==='star'){x.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?70:165,px=380+Math.cos(a)*r,py=270+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.stroke()}if(t==='bear'){x.beginPath();x.arc(300,160,60,0,Math.PI*2);x.arc(460,160,60,0,Math.PI*2);x.arc(380,285,160,0,Math.PI*2);x.stroke()}save()}
document.querySelectorAll('.thumb').forEach(el=>el.onclick=()=>{document.querySelectorAll('.thumb').forEach(n=>n.classList.remove('active'));el.classList.add('active');hist=[];template(el.dataset.t)});
function p(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
c.onpointerdown=e=>{down=true;save();let q=p(e);x.beginPath();x.moveTo(q.x,q.y)};c.onpointermove=e=>{if(!down)return;let q=p(e);x.strokeStyle=erase?'#fff':col;x.lineWidth=erase?28:size;x.lineCap='round';x.lineTo(q.x,q.y);x.stroke()};window.onpointerup=()=>down=false;
brush.onclick=()=>erase=false;eraser.onclick=()=>erase=true;thin.onclick=()=>size=3;thick.onclick=()=>size=14;undo.onclick=()=>{if(hist.length>1){hist.pop();restore(hist[hist.length-1])}};fill.onclick=()=>{save();x.fillStyle=col;x.fillRect(0,0,c.width,c.height)};clear.onclick=()=>template(templ);download.onclick=()=>{const a=document.createElement('a');a.download='thesweetcherry-drawing.png';a.href=c.toDataURL();a.click()};template('heart');
const L=[["cat","apple","sun","cup"],["clock","flower","fish","house"],["bicycle","camera","ice cream","hand"],["castle","roller skate","butterfly","telephone"],["city skyline","dragon","carousel","fashion outfit"]];let lv=0,sec=30,rem=30,it;
function round(){clearInterval(it);rem=sec;timer.textContent=rem;const arr=L[Math.min(lv,L.length-1)];prompt.textContent='Draw: '+arr[Math.floor(Math.random()*arr.length)];lvl.textContent=`Level ${lv+1} • ${sec} seconds`;startGame.classList.add('hidden');finishGame.classList.remove('hidden');it=setInterval(()=>{rem--;timer.textContent=rem;if(rem<=0){clearInterval(it);prompt.textContent="time's up!";finishGame.classList.add('hidden');startGame.classList.remove('hidden');startGame.textContent='restart game'}},1000)}
startGame.onclick=()=>{lv=0;sec=30;round()};finishGame.onclick=()=>{clearInterval(it);lv++;sec=Math.min(60,sec+10);prompt.textContent='you made it! next one is harder...';sweetPing(1050,.14,'triangle',.03);setTimeout(round,850)}
</script></body></html>
