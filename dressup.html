<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dress Up - TheSweetCherry</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="dress-body">
<nav class="site-nav">
  <a href="index.html">home</a>
  <a href="dressup.html">dress up</a>
  <a href="photobooth.html">photobooth</a>
  <a href="quiz.html">let's quiz!</a>
</nav>

<div class="dress-wrap">
  <h1 class="y2k-title" style="text-align:center;font-size:70px;margin:12px">Dress Me! ♡</h1>

  <div class="dress-window">
    <div class="dress-titlebar">🍒 CherryDoll.exe <span style="float:right">_ □ ×</span></div>
    <div class="dress-menu">File Edit View Closet Makeup Help</div>

    <div class="dress-main">
      <aside class="dress-controls">
        <div class="dress-hint">pick a category, then click an option ♡</div>
        <div class="cat-tabs" id="dressTabs"></div>
        <div class="options-grid" id="dressOptions"></div>
      </aside>

      <main class="doll-area">
        <svg id="dollSvg" viewBox="0 0 500 820" xmlns="http://www.w3.org/2000/svg" aria-label="adult fashion doll">
          <defs>
            <pattern id="leopardPattern" width="34" height="34" patternUnits="userSpaceOnUse">
              <rect width="34" height="34" fill="#ff96ca"/>
              <ellipse cx="9" cy="10" rx="7" ry="4" fill="#381023"/>
              <ellipse cx="26" cy="23" rx="6" ry="4" fill="#381023"/>
            </pattern>
            <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>

          <!-- hair behind body -->
          <g id="hairBackLayer"></g>

          <!-- adult body: long legs, narrower waist, relaxed arms -->
          <g id="skinLayer" fill="#d7a07b">
            <ellipse cx="250" cy="112" rx="49" ry="61"/>
            <rect x="232" y="162" width="36" height="38" rx="14"/>
            <path d="M184 201 Q250 171 316 201 L300 347 Q285 379 250 386 Q215 379 200 347Z"/>
            <path d="M190 214 Q161 231 151 279 L126 439 Q132 454 146 447 L176 316 L203 237Z"/>
            <path d="M310 214 Q339 231 349 279 L374 439 Q368 454 354 447 L324 316 L297 237Z"/>
            <path d="M205 368 Q225 386 244 386 L235 704 Q226 732 204 718 L188 435Z"/>
            <path d="M256 386 Q276 386 295 368 L312 718 Q289 733 280 704 L265 435Z"/>
          </g>

          <!-- simple base underwear -->
          <path d="M198 207 Q250 184 302 207 L292 314 Q250 329 208 314Z" fill="#f7e7ee"/>
          <path d="M205 365 Q250 387 295 365 L288 418 Q250 434 212 418Z" fill="#f7e7ee"/>

          <!-- makeup behind facial linework -->
          <g id="shadowLayer"></g>

          <!-- face -->
          <g id="faceLayer">
            <path id="eyeLeft" d="M218 110 Q229 101 240 110" fill="none" stroke="#351425" stroke-width="4" stroke-linecap="round"/>
            <path id="eyeRight" d="M260 110 Q271 101 282 110" fill="none" stroke="#351425" stroke-width="4" stroke-linecap="round"/>
            <path id="mouthLine" d="M231 141 Q250 151 269 141" fill="none" stroke="#c54d7b" stroke-width="5" stroke-linecap="round"/>
            <path id="tearDrop" d="" fill="#7dcaff"/>
          </g>

          <!-- hair in front -->
          <g id="hairFrontLayer"></g>

          <!-- clothes/accessories -->
          <g id="topLayer"></g>
          <g id="bottomLayer"></g>
          <g id="dressLayer"></g>
          <g id="shoeLayer"></g>
          <g id="bagLayer"></g>
        </svg>
      </main>
    </div>

    <div class="dress-bottom">
      <button class="btn" id="randomizeBtn">RANDOMIZE ♡</button>
      <button class="btn" id="resetBtn">RESET</button>
      <button class="btn hot" id="saveDollBtn">SAVE MY DOLL ↓</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="dressup.js"></script>
</body>
</html>
