<style>
body.dress-perfect{
  margin:0;
  min-height:100vh;
  background:
    linear-gradient(rgba(255,110,184,.13),rgba(255,110,184,.13)),
    url('assets/images/pink-leopard.jpg') center/460px auto repeat fixed;
  font-family:Tahoma,Arial,sans-serif;
}
.dress-perfect .site-nav{position:sticky;top:0;z-index:200}
.dress-perfect-wrap{
  width:min(1500px,98vw);
  margin:18px auto 55px;
}
.dress-perfect-title{
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(48px,6.3vw,90px);
  color:#ff8ac7;
  -webkit-text-stroke:2px #651347;
  text-shadow:3px 3px #ffd6e9,6px 6px rgba(80,18,59,.18);
  margin:8px 0 15px;
}
.dress-game-shell{
  position:relative;
  width:100%;
  aspect-ratio:3 / 2;
  min-height:680px;
  background:#f9c6df url('assets/images/dressup-perfect-reference.png') center/100% 100% no-repeat;
  border:5px solid #641548;
  box-shadow:0 0 0 6px #ff8ac7,0 0 0 10px white,0 0 30px rgba(70,0,52,.4);
  overflow:hidden;
}
.live-stage{
  position:absolute;
  left:39.2%;
  top:13.5%;
  width:21.8%;
  height:73.5%;
  background:linear-gradient(rgba(255,225,240,.96),rgba(255,209,232,.95));
  border:2px solid rgba(219,92,157,.28);
  border-radius:32px;
  z-index:5;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.live-stage:before{
  content:"mix, match & create your look! ♡";
  position:absolute;
  top:3.5%;
  width:100%;
  text-align:center;
  color:#df2d8c;
  font-weight:900;
  font-size:clamp(10px,1vw,16px);
}
#liveDoll{
  position:absolute;
  top:10.5%;
  width:88%;
  height:auto;
  max-height:88%;
  filter:drop-shadow(4px 6px 0 rgba(102,20,72,.08));
}
.hotspot{
  position:absolute;
  z-index:10;
  border:0;
  padding:0;
  background:transparent;
  border-radius:9px;
}
.hotspot:hover{
  outline:3px solid #ff3ca1;
  background:rgba(255,255,255,.15);
}
.hotspot.selected{
  outline:4px solid #fff;
  box-shadow:0 0 0 3px #ff38a0,0 0 15px #fff;
}
.hotspot::after{
  content:attr(data-name);
  position:absolute;
  left:50%;bottom:-20px;
  transform:translateX(-50%);
  background:#fff4fa;
  color:#8f1b65;
  border:1px solid #cf699e;
  padding:2px 5px;
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
}
.hotspot:hover::after{opacity:1}
.skin-hotspot{
  position:absolute;z-index:12;border-radius:50%;border:0;
  box-shadow:0 0 0 2px rgba(92,18,66,.35);
}
.skin-hotspot:hover,.skin-hotspot.selected{outline:4px solid white;box-shadow:0 0 0 4px #ff3aa0}
.face-controls{
  position:absolute;
  left:40.7%;top:51.4%;
  width:4.1%;height:28.5%;
  z-index:15;
  display:grid;
  grid-template-rows:repeat(4,1fr);
  gap:6px;
}
.face-controls button{
  border:0;background:transparent;border-radius:10px;
}
.face-controls button:hover,.face-controls button.selected{
  outline:3px solid #ff3ca1;background:rgba(255,255,255,.22)
}
.dress-action{
  position:absolute;z-index:15;
  bottom:3.4%;
  height:6.5%;
  border:0;border-radius:18px;background:transparent;
}
.dress-action:hover{outline:4px solid white;box-shadow:0 0 0 3px #ff3ca1}
#randomBtn{left:26.5%;width:12.4%}
#resetBtn{left:40.8%;width:10.8%}
#saveBtn{left:53.2%;width:15.1%}
.selection-status{
  position:absolute;left:40.2%;bottom:11%;
  width:19.8%;
  z-index:20;text-align:center;
  color:#a31c72;font-size:11px;font-weight:900;
  background:rgba(255,246,251,.86);
  border:1px solid #e39abc;border-radius:9px;padding:3px;
}
@media(max-width:900px){
  .dress-game-shell{
    min-height:0;
  }
  .hotspot::after{display:none}
}
</style>
</head>

<script>
const state={
  skin:'#dca77f', hair:'blonde', top:'none', bottom:'none', dress:'none',
  outer:'none', shoes:'none', bag:'none', face:'smile'
};

const allHotspots=[...document.querySelectorAll('.hotspot')];
const skinBtns=[...document.querySelectorAll('.skin-hotspot')];
const faceBtns=[...document.querySelectorAll('[data-face]')];

function hair(){
  hairBackLayer.innerHTML=''; hairFrontLayer.innerHTML='';
  const colors={blonde:'#e4b34d',brown:'#6b3826',purple:'#49234c',red:'#c72f2f',black:'#21171b'};
  const c=colors[state.hair]||'#e4b34d';
  if(state.hair==='black'){
    hairBackLayer.innerHTML=`<path d="M191 90 Q196 30 250 38 Q312 33 314 104 L318 254 Q292 273 279 244 L284 116 Q267 64 248 70 Q224 64 209 117 L214 245 Q184 271 179 246Z" fill="${c}"/>`;
    hairFrontLayer.innerHTML=`<path d="M198 92 Q216 51 250 60 Q283 52 303 91 Q281 77 269 79 Q249 65 224 81 Q211 77 198 92Z" fill="${c}"/>`;
  }else{
    hairBackLayer.innerHTML=`<path d="M191 92 Q194 31 250 38 Q312 32 314 104 L324 310 Q291 333 282 286 L284 117 Q268 64 248 69 Q223 64 208 118 L212 298 Q182 329 176 288Z" fill="${c}"/>`;
    hairFrontLayer.innerHTML=`<path d="M197 93 Q215 52 250 60 Q283 52 304 92 Q283 76 269 79 Q249 65 224 81 Q211 77 197 93Z" fill="${c}"/>`;
  }
}

function face(){
  eyeLeft.setAttribute('d','M219 106 Q230 97 241 106');
  eyeRight.setAttribute('d','M259 106 Q270 97 281 106');
  mouthLine.setAttribute('d','M232 140 Q250 150 268 140');
  mouthLine.setAttribute('stroke','#cc4f80');
  shadowLayer.innerHTML='';
  if(state.face==='wink') eyeLeft.setAttribute('d','M219 107 Q230 114 241 107');
  if(state.face==='kiss') mouthLine.setAttribute('d','M241 140 Q250 132 259 140 Q250 149 241 140');
  if(state.face==='blush') shadowLayer.innerHTML=`<ellipse cx="214" cy="131" rx="17" ry="8" fill="#f48db5" opacity=".6"/><ellipse cx="286" cy="131" rx="17" ry="8" fill="#f48db5" opacity=".6"/>`;
}

function clothes(){
  topLayer.innerHTML=bottomLayer.innerHTML=dressLayer.innerHTML=outerLayer.innerHTML=shoeLayer.innerHTML=bagLayer.innerHTML='';

  const tops={
    stripe:`<path d="M199 207 Q250 186 301 207 L293 317 Q250 332 207 317Z" fill="#f7e9ec"/><g stroke="#33202b" stroke-width="7"><path d="M205 228 H295"/><path d="M205 252 H295"/><path d="M207 276 H293"/><path d="M209 300 H291"/></g>`,
    pinkCorset:`<path d="M199 207 Q250 184 301 207 L293 318 Q250 332 207 318Z" fill="#ff86bd"/><path d="M214 214 L226 310 M286 214 L274 310" stroke="#b0206d" stroke-width="4"/>`,
    redCardigan:`<path d="M190 208 Q250 179 310 208 L299 325 Q270 313 250 319 Q229 313 201 325Z" fill="#cf343c"/><path d="M250 202 V318" stroke="#8c1f2a" stroke-width="4"/>`,
    whiteBlouse:`<path d="M193 208 Q250 181 307 208 L297 327 Q250 340 203 327Z" fill="#fffdf8"/><circle cx="250" cy="235" r="4" fill="#b48a99"/><circle cx="250" cy="255" r="4" fill="#b48a99"/>`,
    yellowHalter:`<path d="M210 203 Q250 187 290 203 L292 310 Q250 325 208 310Z" fill="#ffd96a"/>`,
    pinkBlack:`<path d="M205 204 Q250 185 295 204 L291 318 Q250 330 209 318Z" fill="#252029"/><path d="M215 214 Q250 192 285 214 L281 265 Q250 276 219 265Z" fill="#ed4c9d"/>`
  };
  if(tops[state.top])topLayer.innerHTML=tops[state.top];

  const bottoms={
    denimMini:`<path d="M205 369 Q250 390 295 369 L291 450 Q250 466 209 450Z" fill="#5279a4"/>`,
    blackMini:`<path d="M205 369 Q250 390 295 369 L291 450 Q250 466 209 450Z" fill="#19151a"/>`,
    pinkMini:`<path d="M205 369 Q250 390 295 369 L291 450 Q250 466 209 450Z" fill="#f29bc4"/>`,
    wideJeans:`<path d="M205 371 L246 381 L238 716 L193 716 L207 449 M254 381 L295 371 L307 716 L262 716 L285 449" fill="#304c79"/>`,
    cargo:`<path d="M205 371 L246 381 L238 716 L193 716 L207 449 M254 381 L295 371 L307 716 L262 716 L285 449" fill="#766f5e"/><rect x="191" y="490" width="45" height="58" fill="#5a5548"/><rect x="264" y="490" width="45" height="58" fill="#5a5548"/>`,
    sparklePants:`<path d="M205 371 L246 381 L238 716 L193 716 L207 449 M254 381 L295 371 L307 716 L262 716 L285 449" fill="#5a4a58"/><g fill="#fff"><circle cx="220" cy="450" r="3"/><circle cx="276" cy="525" r="3"/><circle cx="224" cy="610" r="3"/><circle cx="285" cy="665" r="3"/></g>`

    blackPinkDress:`<path d="M195 204 Q250 181 305 204 L296 315 L322 503 Q250 527 178 503 L204 315Z" fill="#171218"/><path d="M207 208 Q250 188 293 208 L290 274 Q250 287 210 274Z" fill="#ee65a8"/>`

  const outers={
    brownJacket:`<path d="M187 207 Q250 178 313 207 L306 341 L284 326 L278 222 L250 237 L222 222 L216 326 L194 341Z" fill="#6a3f29"/>`,
    blackJacket:`<path d="M187 207 Q250 178 313 207 L306 341 L284 326 L278 222 L250 237 L222 222 L216 326 L194 341Z" fill="#171518"/>`,
    pinkFur:`<path d="M184 207 Q250 176 316 207 L307 326 Q286 345 275 315 L275 226 L250 240 L225 226 L225 315 Q214 345 193 326Z" fill="#f5a3cc"/>`,
    denimJacket:`<path d="M187 207 Q250 178 313 207 L306 341 L284 326 L278 222 L250 237 L222 222 L216 326 L194 341Z" fill="#5279a4"/>`,
    leopardJacket:`<path d="M187 207 Q250 178 313 207 L306 341 L284 326 L278 222 L250 237 L222 222 L216 326 L194 341Z" fill="url(#cheetahPattern)"/>`
  };
  if(outers[state.outer])outerLayer.innerHTML=outers[state.outer];

  const shoes={
    blackBoot:`<path d="M193 650 L239 650 L239 742 L193 742Z M261 650 L307 650 L307 742 L261 742Z" fill="#151217"/>`,
    pinkSneaker:`<path d="M187 706 Q216 725 240 707 L244 741 L187 741Z M257 707 Q281 725 312 709 L317 742 L256 742Z" fill="#ff70ac" stroke="#fff" stroke-width="3"/>`,
    blackSneaker:`<path d="M187 706 Q216 725 240 707 L244 741 L187 741Z M257 707 Q281 725 312 709 L317 742 L256 742Z" fill="#171217" stroke="#fff" stroke-width="3"/>`,
    pinkHeel:`<path d="M192 706 Q216 721 239 707 L237 741 L193 741Z M262 707 Q281 721 307 708 L309 742 L261 742Z" fill="#ee75ae"/>`,
    leopardBoot:`<path d="M193 650 L239 650 L239 742 L193 742Z M261 650 L307 650 L307 742 L261 742Z" fill="url(#cheetahPattern)"/>`,
    whiteBoot:`<path d="M193 650 L239 650 L239 742 L193 742Z M261 650 L307 650 L307 742 L261 742Z" fill="#fff"/>`
  };
  if(shoes[state.shoes])shoeLayer.innerHTML=shoes[state.shoes];

  const bags={
    brownBag:`<path d="M329 284 Q362 260 396 284 L388 343 L337 343Z" fill="#795038"/><path d="M344 283 Q363 245 384 283" fill="none" stroke="#4b321f" stroke-width="5"/>`,
    blackBag:`<path d="M329 284 Q362 260 396 284 L388 343 L337 343Z" fill="#171217"/><path d="M344 283 Q363 245 384 283" fill="none" stroke="#4b321f" stroke-width="5"/>`,
    pinkBag:`<rect x="333" y="279" width="61" height="57" rx="8" fill="#ff78b8"/><path d="M344 279 Q363 245 383 279" fill="none" stroke="#aa336e" stroke-width="5"/>`,
    whiteBag:`<rect x="333" y="279" width="61" height="57" rx="8" fill="#fffdf8"/><path d="M344 279 Q363 245 383 279" fill="none" stroke="#b09a81" stroke-width="5"/>`,
    darkBag:`<path d="M329 284 Q362 260 396 284 L388 343 L337 343Z" fill="#4a281f"/><path d="M344 283 Q363 245 384 283" fill="none" stroke="#2a1612" stroke-width="5"/>`
  };
  if(bags[state.bag])bagLayer.innerHTML=bags[state.bag];
}

function apply(){
  skinLayer.setAttribute('fill',state.skin);
  hair();face();clothes();
  allHotspots.forEach(b=>b.classList.toggle('selected',state[b.dataset.group]===b.dataset.value));
  skinBtns.forEach(b=>b.classList.toggle('selected',state.skin===b.dataset.skin));
  faceBtns.forEach(b=>b.classList.toggle('selected',state.face===b.dataset.face));
}

allHotspots.forEach(b=>b.addEventListener('click',()=>{
  const g=b.dataset.group,v=b.dataset.value;
  state[g]=v;
  if(g==='dress'){state.top='none';state.bottom='none'}
  if(g==='top'||g==='bottom')state.dress='none';
  status.textContent=`selected: ${b.dataset.name} ♡`;
  apply();
  if(window.tone)tone(930,.06);
}));

skinBtns.forEach(b=>b.addEventListener('click',()=>{
  state.skin=b.dataset.skin;status.textContent='skin tone updated ♡';apply();
}));

faceBtns.forEach(b=>b.addEventListener('click',()=>{
  state.face=b.dataset.face;status.textContent=`face: ${b.title} ♡`;apply();
}));

randomBtn.onclick=()=>{
  const groups=['hair','top','bottom','outer','shoes','bag'];
  groups.forEach(g=>{
    const opts=allHotspots.filter(b=>b.dataset.group===g);
    if(opts.length)state[g]=opts[Math.floor(Math.random()*opts.length)].dataset.value;
  });
  state.dress='none';
  state.skin=skinBtns[Math.floor(Math.random()*skinBtns.length)].dataset.skin;
  state.face=faceBtns[Math.floor(Math.random()*faceBtns.length)].dataset.face;
  status.textContent='randomized your look ✦';
  apply();
};

resetBtn.onclick=()=>{
  Object.assign(state,{skin:'#dca77f',hair:'blonde',top:'none',bottom:'none',dress:'none',outer:'none',shoes:'none',bag:'none',face:'smile'});
  status.textContent='reset ♡';
  apply();
};

saveBtn.onclick=()=>{
  const svg=new XMLSerializer().serializeToString(liveDoll);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=1000;c.height=1640;
    const x=c.getContext('2d');x.fillStyle='#ffd8ea';x.fillRect(0,0,c.width,c.height);
    x.drawImage(img,0,0,c.width,c.height);
    const a=document.createElement('a');a.download='thesweetcherry-look.png';a.href=c.toDataURL();a.click();
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
};

apply();
</script>
</body>
</html>
