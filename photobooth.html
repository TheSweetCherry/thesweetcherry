<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photobooth - thesweetcherry</title><link rel="stylesheet" href="styles.css"></head><body class="photo-bg">
<nav class="topnav"><a href="index.html">home</a><a href="quiz.html">let's quiz!</a><a href="paint.html">paint</a><a href="photobooth.html">photobooth</a><button class="sound-toggle" onclick="toggleSweetSound()">🔊 sound on</button></nav><h1 class="sub-title">Photobooth</h1><div style="text-align:center;font-weight:900;color:#fff;text-shadow:2px 2px #7a165b;margin-top:-18px;margin-bottom:18px">your camera lives inside the cherryBook screen ♡</div>
<div class="photo-wrap"><section><div class="cherrybook"><img src="assets/images/cherrybook-shell-v4.png" class="laptop-shell"><div class="video-screen"><video id="video" autoplay playsinline muted></video><button class="btn primary start-cam" id="startCam">START CAMERA ♡</button><div class="countdown hidden" id="countdown"></div></div></div><div class="preview4"><div id="p0"></div><div id="p1"></div><div id="p2"></div><div id="p3"></div></div></section>
<aside class="photo-controls"><div class="card print-panel"><div class="section-title" style="font-size:40px">choose your print</div><div class="format-tabs"><button class="btn" data-format="classic">classic strip</button><button class="btn" data-format="phone">cherryMobile</button><button class="btn" data-format="sheet">computer sheet</button></div><div class="frame-grid" id="frames"><button class="frame-pick f-cheetah" data-frame="cheetah"><span></span></button><button class="frame-pick f-glitter" data-frame="glitter"><span></span></button><button class="frame-pick f-white" data-frame="white"><span></span></button><button class="frame-pick f-cherry" data-frame="cherry"><span>🍒</span></button><button class="frame-pick f-red" data-frame="red"><span></span></button><button class="frame-pick f-gum" data-frame="gum"><span></span></button><button class="frame-pick f-butter" data-frame="butter"><span></span></button><button class="frame-pick f-toffee" data-frame="toffee"><span></span></button><button class="frame-pick f-green" data-frame="green"><span></span></button></div></div><div class="card print-panel output-box"><canvas id="out" width="560" height="1600"></canvas><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px"><button class="btn" onclick="doodleColor='#ff3fa7'">pink doodle</button><button class="btn" onclick="doodleColor='#111'">black doodle</button><button class="btn primary" id="download">SAVE PIC ♡</button></div></div></aside></div>
<script src="common.js"></script><script>
let stream=null,pics=[],frame='cheetah',format='classic',draw=false,dcol='#ff3fa7';const ctx=out.getContext('2d');
startCam.onclick=async()=>{try{if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});video.srcObject=stream}startCam.classList.add('hidden');setTimeout(sequence,500)}catch(e){alert('Please allow camera access.')}}
function cd(){return new Promise(res=>{let n=3;countdown.classList.remove('hidden');countdown.textContent=n;let t=setInterval(()=>{sweetTone(680,.05);n--;if(!n){countdown.textContent='✦';clearInterval(t);setTimeout(()=>{countdown.classList.add('hidden');res()},220)}else countdown.textContent=n},600)})}
async function sequence(){pics=[];for(let i=0;i<4;i++){await cd();capture(i);sweetTone(1200,.05,'square',.02);await new Promise(r=>setTimeout(r,420))}render();startCam.textContent='TAKE AGAIN';startCam.classList.remove('hidden')}
function capture(i){let c=document.createElement('canvas');c.width=640;c.height=480;let q=c.getContext('2d');q.translate(640,0);q.scale(-1,1);q.drawImage(video,0,0,640,480);pics.push(c);let im=document.createElement('img');im.src=c.toDataURL();document.getElementById('p'+i).innerHTML='';document.getElementById('p'+i).appendChild(im)}
document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{frame=b.dataset.frame;render()});document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{format=b.dataset.format;render()});
function frameBg(){return {cheetah:'#e796b9',glitter:'#ff3fa7',white:'#fff',cherry:'#ffb0cd',red:'#c33a27',gum:'#ffa7d4',butter:'#f2de74',toffee:'#6b3127',green:'#385c35'}[frame]}
function drawPattern(){if(frame==='cheetah'){ctx.fillStyle='#1e1118';for(let i=0;i<180;i++){let x=Math.random()*out.width,y=Math.random()*out.height,r=5+Math.random()*8;ctx.beginPath();ctx.ellipse(x,y,r,r*.55,Math.random()*3,0,Math.PI*2);ctx.strokeStyle='#1e1118';ctx.lineWidth=4;ctx.stroke()}}if(frame==='glitter'){ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<250;i++){ctx.fillRect(Math.random()*out.width,Math.random()*out.height,1+Math.random()*3,1+Math.random()*3)}}if(frame==='cherry'){ctx.font='30px serif';for(let y=20;y<out.height;y+=70)for(let x=15;x<out.width;x+=90)ctx.fillText('🍒',x,y)}}
function render(){ctx.clearRect(0,0,out.width,out.height);ctx.fillStyle=frameBg();ctx.fillRect(0,0,out.width,out.height);drawPattern();if(!pics.length){ctx.fillStyle='#fff';ctx.font='26px Arial';ctx.textAlign='center';ctx.fillText('take 4 photos first ♡',out.width/2,100);return}if(format==='classic'){let m=40,g=20,h=(out.height-m*2-g*3)/4;pics.forEach((p,i)=>{let y=m+i*(h+g);ctx.fillStyle='#fff';ctx.fillRect(m,y,out.width-m*2,h);ctx.drawImage(p,m,y,out.width-m*2,h)});ctx.fillStyle=frame==='white'?'#111':'#fff';ctx.font='24px Arial';ctx.textAlign='center';ctx.fillText('thesweetcherry ✦',out.width/2,out.height-10)}else if(format==='phone'){ctx.fillStyle='#151515';ctx.roundRect(35,20,out.width-70,out.height-40,40);ctx.fill();ctx.fillStyle='#fff';ctx.font='22px monospace';ctx.fillText('6:24 PM   cherryMobile',out.width/2,58);let m=62,g=12,h=245;pics.forEach((p,i)=>ctx.drawImage(p,m,85+i*(h+g),out.width-m*2,h));ctx.fillStyle='#111';ctx.fillRect(70,1125,out.width-140,360);ctx.fillStyle='#ff4fa9';ctx.font='28px monospace';for(let r=0;r<5;r++)for(let c=0;c<8;c++)ctx.fillText('•',105+c*48,1180+r*55)}else{ctx.fillStyle='#eee7da';ctx.fillRect(18,18,out.width-36,out.height-36);let w=235,h=300;pics.forEach((p,i)=>{let x=42+(i%2)*(w+22),y=65+Math.floor(i/2)*(h+70);ctx.fillStyle='#fff';ctx.fillRect(x,y,w,h);ctx.fillStyle='#111';ctx.font='12px monospace';ctx.fillText('File  Edit  View  Special',x+7,y+16);ctx.drawImage(p,x,y+25,w,h-25)});ctx.fillStyle='#111';ctx.font='18px monospace';ctx.fillText('Folder     Trash     Memo',out.width/2,820)}}
function pos(e){let r=out.getBoundingClientRect();return{x:(e.clientX-r.left)*out.width/r.width,y:(e.clientY-r.top)*out.height/r.height}}out.onpointerdown=e=>{if(!pics.length)return;draw=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};out.onpointermove=e=>{if(!draw)return;let p=pos(e);ctx.strokeStyle=dcol;ctx.lineWidth=8;ctx.lineCap='round';ctx.lineTo(p.x,p.y);ctx.stroke()};window.addEventListener('pointerup',()=>draw=false);download.onclick=()=>{if(!pics.length)return alert('take your photos first!');let a=document.createElement('a');a.download='thesweetcherry-photo.png';a.href=out.toDataURL();a.click()};render()
</script></body></html>
