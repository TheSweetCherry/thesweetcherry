<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photobooth - thesweetcherry</title><link rel="stylesheet" href="styles.css"></head>
<body class="photo-bg subpage">
<nav class="topnav"><a href="index.html">home</a><a href="quiz.html">quiz</a><a href="paint.html">paint</a><a href="photobooth.html">photobooth</a><button class="sound-toggle" onclick="toggleSweetSound()">🔊 sound on</button></nav>
<h1 class="sub-title">cherryBook photobooth ♡</h1>
<div class="photostage"><section><div class="booth" id="booth"><div class="sign">cherryBook</div><div class="boothinner"><div><div class="prevstrip"><div class="shot">1</div><div class="shot">2</div><div class="shot">3</div><div class="shot">4</div></div></div><div class="cambay" id="bay"><video id="video" autoplay playsinline muted></video><div class="curtain"></div><button class="btn primary enter" id="enter">ENTER →</button><div class="countdown hidden" id="countdown"></div></div></div></div>
<div class="output"><div class="small"><b>PHOTOS DELIVERED HERE</b></div><div class="slot"></div><div class="outwrap"><canvas id="strip" width="500" height="1500"></canvas></div></div></section>
<aside class="photoctrl">
<div class="card" style="padding:16px"><h2>1. cherryBook color</h2><button class="btn" onclick="booth.classList.remove('blue')">pearl pink</button> <button class="btn" onclick="booth.classList.add('blue')">baby blue</button></div>
<div class="card" style="padding:16px"><h2>2. choose your print</h2><div class="frames"><button class="frame" data-f="pink"><div></div></button><button class="frame" data-f="blue"><div></div></button><button class="frame" data-f="dots"><div></div></button><button class="frame" data-f="stripe"><div></div></button><button class="frame" data-f="green"><div></div></button><button class="frame" data-f="white"><div></div></button></div></div>
<div class="card" style="padding:16px"><h2>3. doodle</h2><p class="small">Draw directly on the printed strip.</p><button class="btn" onclick="dc='#ff4fa3'">pink</button> <button class="btn" onclick="dc='#111'">black</button> <button class="btn" onclick="dc='#7ca7ff'">blue</button></div>
<button class="btn primary" id="download">download photo strip ↓</button><p class="small">Your camera will work best on the live GitHub Pages HTTPS site.</p>
</aside></div>
<script src="common.js"></script><script>
const v=video,ctx=strip.getContext('2d');let pics=[],frame='pink',camera=false,doodle=false,dc='#ff4fa3';
async function cam(){try{v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});camera=true}catch(e){alert("Camera couldn't start. Allow camera access once this is hosted online.")}}
enter.onclick=async()=>{if(!camera)await cam();if(!camera)return;bay.classList.add('open');enter.classList.add('hidden');setTimeout(seq,600)};
function cd(){return new Promise(res=>{let n=3;countdown.classList.remove('hidden');countdown.textContent=n;const t=setInterval(()=>{sweetPing(680,.05);n--;if(!n){countdown.textContent='✦';clearInterval(t);setTimeout(()=>{countdown.classList.add('hidden');res()},240)}else countdown.textContent=n},600)})}
async function seq(){pics=[];document.querySelectorAll('.shot').forEach((s,i)=>s.textContent=i+1);for(let i=0;i<4;i++){await cd();cap(i);sweetPing(1200,.05,'square',.025);await new Promise(r=>setTimeout(r,420))}render();strip.classList.remove('printing');void strip.offsetWidth;strip.classList.add('printing');enter.textContent='TAKE AGAIN';enter.classList.remove('hidden')}
function cap(i){const c=document.createElement('canvas');c.width=640;c.height=480;const q=c.getContext('2d');q.translate(640,0);q.scale(-1,1);q.drawImage(v,0,0,640,480);pics.push(c);const im=document.createElement('img');im.src=c.toDataURL();const s=document.querySelectorAll('.shot')[i];s.innerHTML='';s.appendChild(im)}
const fs={pink:['#f4adc6',null],blue:['#84adfa',null],dots:['#f2d75e','dots'],stripe:['#5b2b25','stripe'],green:['#315832',null],white:['#fff',null]};
document.querySelectorAll('.frame').forEach(b=>b.onclick=()=>{frame=b.dataset.f;if(pics.length)render()});
function render(){ctx.clearRect(0,0,500,1500);const st=fs[frame];ctx.fillStyle=st[0];ctx.fillRect(0,0,500,1500);if(st[1]==='dots'){ctx.fillStyle='#d75b52';for(let y=18;y<1500;y+=34)for(let x=18;x<500;x+=34){ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}}if(st[1]==='stripe'){for(let x=0;x<500;x+=40){ctx.fillStyle=x%80===0?'#f2b5cb':'#fff';ctx.fillRect(x,0,40,1500)}}const m=42,g=22,h=(1500-m*2-g*3)/4;pics.forEach((p,i)=>{let y=m+i*(h+g);ctx.fillStyle='#fff';ctx.fillRect(m,y,500-m*2,h);ctx.drawImage(p,m,y,500-m*2,h)});ctx.fillStyle='#222';ctx.font='22px Arial';ctx.textAlign='center';ctx.fillText('thesweetcherry ✦',250,1486)}
function pos(e){const r=strip.getBoundingClientRect();return{x:(e.clientX-r.left)*strip.width/r.width,y:(e.clientY-r.top)*strip.height/r.height}}
strip.onpointerdown=e=>{if(!pics.length)return;doodle=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};strip.onpointermove=e=>{if(!doodle)return;let p=pos(e);ctx.strokeStyle=dc;ctx.lineWidth=8;ctx.lineCap='round';ctx.lineTo(p.x,p.y);ctx.stroke()};window.addEventListener('pointerup',()=>doodle=false);download.onclick=()=>{if(!pics.length)return alert('Take your photos first!');const a=document.createElement('a');a.download='thesweetcherry-photo-strip.png';a.href=strip.toDataURL();a.click()};render()
</script></body></html>
